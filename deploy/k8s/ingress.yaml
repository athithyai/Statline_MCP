# Exposes the server at https://<host>/mcp, the shape MCP clients expect.
#
# Streamable HTTP holds long-lived responses open, so the read timeout must be
# generous or the ingress will cut a tool call off mid-stream. The annotations
# below are for ingress-nginx; translate them if your cluster uses Traefik,
# HAProxy or a cloud load balancer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: statline-mcp
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # Server-sent events must not be buffered, or the client sees nothing
    # until the response completes.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    # Replace with the hostname your cluster serves this on.
    - host: statline-mcp.example.k8s.local
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: statline-mcp
                port:
                  name: http
          - path: /health
            pathType: Exact
            backend:
              service:
                name: statline-mcp
                port:
                  name: http
