apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/name: statline-mcp
    includeSelectors: false

# Override per environment, e.g.
#   kustomize edit set image ghcr.io/athithyai/statline_mcp=ghcr.io/me/statline-mcp:v0.3.0
images:
  - name: ghcr.io/athithyai/statline_mcp
    newTag: latest
