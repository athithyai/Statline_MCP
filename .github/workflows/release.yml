# Builds the container image and pushes it to GitHub Container Registry, so a
# Kubernetes cluster can pull it. This is the GitHub -> registry -> cluster
# half of the pipeline; the cluster side is in deploy/k8s/.
#
# FastMCP Cloud does not use this: it builds from source on push to main.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the pushed image
        run: |
          IMAGE_REF=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name statline -p 8000:8000 "$IMAGE_REF"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "\nimage is serving"
              exit 0
            fi
            sleep 2
          done
          docker logs statline
          exit 1
